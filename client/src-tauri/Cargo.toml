[package]
name = "sayit"
version = "0.1.9"
authors = ["Liu Qianglong", "Claude"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
zip = "0.6"
dirs = "5"
hostname = "0.4"
whoami = "1"
base64 = "0.22"
# 校验更新安装包的 SHA-512（manifest 里给的是 Base64 编码）。安装包下载后会在临时
# 目录里等到用户点更新，驻留时间可能很长，装之前必须确认它还是我们下载的那一个。
sha2 = "0.10.8"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
regex = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
once_cell = "1"
flate2 = "1"
tar = "0.4"
bzip2 = "0.4"
tokio = { version = "1", features = ["rt", "macros", "time"] }
silero-vad-crs = { version = "=0.4.0", features = ["auto"] }
# GGUF / ggml 本地 ASR 引擎（transcribe.cpp 的官方 Rust 绑定，MIT）。
# dynamic-backends：各计算后端编成可 dlopen 的模块（隐含 shared，libtranscribe
# 本身也是 DLL），运行时按 CPU 指令集挑最优的 ggml-cpu-* 模块。
# 本地自用构建：仅 CPU（未装 Vulkan SDK 时构建最稳）。后续需要 GPU 加速时，
# 加回 "vulkan" feature 并安装 Vulkan SDK 重新构建即可。
# 注意：首次构建会用 CMake 从源码编整棵 C++ 树（约 20 分钟），之后走缓存。
transcribe-cpp = { version = "0.1.3", default-features = false, features = [
  "dynamic-backends",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  # GetProcessMemoryInfo：报告本地模型加载后的真实内存占用（诊断页 + 调优实测）
  "Win32_System_ProcessStatus",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security_Cryptography",
  "Win32_Graphics_Gdi",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  # Delivery 1A watch receiver: atomic ReplaceFileW (write-through) for received_watch.wav
  "Win32_Storage_FileSystem",
] }
# 与 tauri/wry 内部同版本，用于挂 WebView2 的 PermissionRequested 处理器（把麦克风置为持久授权）
webview2-com = "0.38"

# ── Delivery 1A watch transport receiver (debug-only) ──
# 阻塞式 tiny_http 监听器。依赖本身常驻 Cargo 图内，但 watch_receiver 模块
# 在 main.rs 中以 #[cfg(debug_assertions)] 声明，release 构建不编译该模块，
# 也没有任何接收端启动路径（含 release-guard 测试）。
tiny_http = "0.12"

# ── Delivery 1C watch auto-discovery (debug-only) ──
# 标准 DNS-SD/mDNS 广播（RFC 6762/6763），不自定义 UDP 广播协议。只在 debug
# receiver 成功绑定端口之后注册 _sayit-watch._tcp；release 构建既不编译
# watch_receiver::mdns，也没有任何注册入口（含 release-guard 测试）。
# 依赖本身常驻 Cargo 图内，与 tiny_http 同样的处理方式。
mdns-sd = "0.21"

# Release 体积/性能优化。panic 保持 unwind：Tauri 与 catch_unwind 依赖它，
# 换成 abort 会让引擎 panic 直接杀进程。
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
